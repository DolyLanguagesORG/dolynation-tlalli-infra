# Stack de un entorno de STAGING / PRODUCCIÓN / REHEARSAL.
#
# A diferencia de `docker-compose.dev.yml` (que monta el codigo del host y
# corre en modo watch), este compose se despliega **por imagen**: el servidor
# NUNCA compila. Eso es lo que hace que staging pruebe lo mismo que va a
# produccion.
#
# La imagen se etiqueta con el **SHA** exacto del commit y con la version.
# El despliegue baja una imagen ya construida; el SHA es lo que se despliega
# y lo que permite hacer rollback.
#
# Los puertos y el nombre de la red se parametrizan para que el mismo archivo
# sirva a los tres entornos:
#
#   COMPOSE_PROJECT_NAME=doly-rehearsal  ->  57040 / 57041 / 57042
#   COMPOSE_PROJECT_NAME=doly-staging     ->  57020 / 57021 / 57022
#   COMPOSE_PROJECT_NAME=doly-prod        ->  57030 / 57031 / 57032
#
# Los secretos llegan por variables de entorno (del `.env` que escribe el
# workflow de despliegue). Ningun valor sensible vive aqui.
#
# Ver operations/PLAN-DE-DESPLIEGUE.md.

name: ${COMPOSE_PROJECT_NAME:-doly-staging}

services:
  database:
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME:-doly-staging}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Solo local: el unico que llega a la base de datos es el proxy de
      # este servidor. Publicarlo en 0.0.0.0 dejaria PostgreSQL accesible
      # desde internet.
      - "127.0.0.1:${DB_HOST_PORT:-57020}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # El schema: se aplica en el primer arranque. Los cambios
      # incrementales van en database/postgres/updates/.
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # La imagen la publica el workflow build-images.yml. La etiqueta es el
    # SHA del commit: inmutable y auditable.
    image: ghcr.io/dolylanguagesorg/dolynation-atl-back:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-doly-staging}-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Mexico_City}
      PORT: 3333
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PREFIX: ${API_PREFIX:-api/v1}
      APP_NAME: dolynglish-backend
      # La version y el commit los lleva la imagen (ARG -> ENV) y NO se
      # declaran aqui: sobrescribirlos con un valor vacio haria que el
      # contenedor reportara "unknown" en vez de su build real.
      # Para un override puntual, el deploy los pasa por `environment:`.
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_LOGGING: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-minimax}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
    ports:
      # Solo local: lo consume el proxy (nginx) de este servidor.
      - "127.0.0.1:${BACKEND_HOST_PORT:-57021}:3333"
    networks:
      - app-net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 y no localhost: en Alpine `localhost` resuelve a ::1 (IPv6)
      # y el contenedor escucha en 0.0.0.0 (IPv4), asi que wget recibiria
      # "Connection refused" aunque la app este bien.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/api/v1/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ghcr.io/dolylanguagesorg/dolynation-tonatiuh-front:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-doly-staging}-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Mexico_City}
      NODE_ENV: production
      # El proxy de Next.js reenvia a la API por la red interna: el
      # navegador nunca ve la direccion del backend.
      BACKEND_INTERNAL_URL: http://backend:3333/api/v1
      # Igual que en el backend: la version y el commit van en la imagen.
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-57022}:3000"
    networks:
      - app-net
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # 127.0.0.1 y no localhost: mismo motivo que en el backend.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  # El nombre del volumen lleva el del proyecto, para que los tres
  # ambientes no compartan la base de datos. Docker no admite variables en
  # las claves de volumen, asi que el nombre lo fija `name:` en el servicio.
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-doly-staging}-pgdata

networks:
  app-net:
    name: ${COMPOSE_PROJECT_NAME:-doly-staging}-net
    driver: bridge
