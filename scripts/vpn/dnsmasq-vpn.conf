# Resolutor DNS de la VPN de DolyNation.
#
# Solo escucha en la direccion del hub del tunel (10.90.0.1): nadie desde
# internet puede alcanzarlo. Responde con la IP DE TUNEL de cada servicio,
# de modo que dentro de la VPN `devapi.dolynation.app` apunte a 10.90.0.2 y
# NO a ninguna IP publica.
#
# Sin esto, un equipo con la VPN levantada abriria el nombre en el navegador
# y saldria por su conexion normal de internet: la VPN seria decorativa.
#
# El resto de nombres se resuelven como siempre (el resolver del sistema).

# Solo en la interfaz del tunel, y solo para las familias de la VPN.
listen-address=10.90.0.1
bind-interfaces

# Dominios de la VPN -> IP de tunel del peer del servicio.
# Un dominio y una IP por linea: no hay comodines.
address=/devapi.dolynation.app/10.90.0.2
address=/devweb.dolynation.app/10.90.0.3
address=/devsite.dolynation.app/10.90.0.5
address=/minios.doly.internal/10.90.0.4

# Y que NO exista version IPv6 (AAAA) de esos nombres. Cloudflare tambien
# los publica en IPv6: un navegador que prefiera IPv6 se saltaria el
# tunel y llegaria al origen por la via publica, sin mTLS. Con la direccion
# :: vacia, el cliente se queda con el IPv4 del tunel.
address=/devapi.dolynation.app/::
address=/devweb.dolynation.app/::
address=/devsite.dolynation.app/::
address=/minios.doly.internal/::

# Todo lo demas, al resolver del sistema (systemd-resolved).
server=127.0.0.53

# No hacemos DHCP ni DNS dinamico: esto es un resolver fijo.
no-resolv

# Cache pequena: el hub no es un DNS publico.
cache-size=1000

# Silenciar las consultas al log (el nombre se ve en los logs del proxy).
log-queries
