name: kanban

# Sincroniza el tablero Kanban de la organizacion.
#
# El tablero (https://github.com/orgs/DolyLanguagesORG/projects/1) tiene un
# campo `Status` con cuatro valores: Todo, In Progress, In Review y Done.
# GitHub actualiza solo los campos que el mismo gestiona ("Linked pull
# requests", "Sub-issues progress"); el `Status` hay que moverlo a mano, y
# por eso se quedaba en "Todo" con el PR ya abierto.
#
# Este workflow lo mueve solo, en este repo:
#
#   PR abierto que referencia la issue   ->  In Review
#   PR mergeado que cierra la issue      ->  Done
#   PR cerrado sin mergear               ->  Todo (vuelve a la cola)
#   Issue cerrada                        ->  Done
#   Issue reabierta                      ->  Todo
#
# Tambien se puede correr a mano (`workflow_dispatch`): con `issue` sincroniza
# esa issue; sin `issue`, sincroniza **todas** las de este repo.
#
# Los cuatro repos tienen este mismo workflow (es el patron de CI del
# proyecto: cada repo es autonomo).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed, synchronize]
  issues:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue a sincronizar (vacio = todas las de este repo)'
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: kanban-${{ github.repository }}
  cancel-in-progress: true

env:
  PROJECT_ID: PVT_kwDOE-Gmfs4BlBqa
  FIELD_ID: PVTSSF_lADOE-Gmfs4BlBqazhjwD-0
  OPT_DONE: 98236657
  OPT_TODO: f75ad846
  OPT_IN_REVIEW: 35fd4ec4

jobs:
  sync:
    name: Sincronizar el tablero
    runs-on: ubuntu-latest
    steps:
      - name: Calcular el estado destino
        id: calc
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.action }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          # --- Que issues menciona este PR? ---
          if [ "$EVENT" = "issues" ]; then
            NUMEROS="$ISSUE_NUMBER"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_ISSUE" ]; then
            NUMEROS="$INPUT_ISSUE"
          else
            NUMEROS="$(printf '%s\n' "$PR_BODY" | grep -oE '(^|[^A-Za-z0-9-])#[0-9]+' | grep -oE '[0-9]+' | sort -u | tr '\n' ' ' || true)"
            RAMA_NUM="$(printf '%s' "$HEAD_REF" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+' || true)"
            if [ -n "$RAMA_NUM" ]; then NUMEROS="$NUMEROS $RAMA_NUM"; fi
          fi

          echo "numeros=$NUMEROS" >> "$GITHUB_OUTPUT"

          # --- El estado destino ---
          case "$EVENT" in
            issues)
              if [ "$ACTION" = "closed" ]; then DESTINO="$OPT_DONE"; else DESTINO="$OPT_TODO"; fi
              ;;
            pull_request)
              if [ "$ACTION" = "closed" ]; then
                if [ "$PR_MERGED" = "true" ]; then DESTINO="$OPT_DONE"; else DESTINO="$OPT_TODO"; fi
              else
                DESTINO="$OPT_IN_REVIEW"
              fi
              ;;
            *) DESTINO="" ;;
          esac

          echo "destino=$DESTINO" >> "$GITHUB_OUTPUT"

      - name: Listar los items del tablero
        id: items
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Se usa la API GraphQL con el ID del project: la CLI `gh project`
          # necesita resolver si el owner es usuario u organizacion, y con un
          # token que no tiene `read:org` falla con "unknown owner type".
          gh api graphql -f query='
            query($id: ID!) {
              node(id: $id) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue {
                          number
                          repository { name }
                          state
                        }
                      }
                      fieldValues(first: 20) {
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue { optionId name }
                          ... on ProjectV2ItemFieldPullRequestValue {
                            pullRequests(first: 10) { nodes { number state } }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f id="$PROJECT_ID" > /tmp/items.json

          # Una linea por item: repo<TAB>numero<TAB>item_id<TAB>status<TAB>prs_abiertos<TAB>prs_mergeados
          jq -r '
            .data.node.items.nodes[]
            | select(.content.repository.name == (env.REPO | split("/") | last))
            | (.fieldValues.nodes
               | map(select(.optionId != null) | .optionId) | first // "") as $status
              | ([.fieldValues.nodes[] | select(.pullRequests != null) | .pullRequests.nodes[] | select(.state == "OPEN") ] | length) as $abiertos
              | ([.fieldValues.nodes[] | select(.pullRequests != null) | .pullRequests.nodes[] | select(.state == "MERGED") ] | length) as $mergeados
            | [.content.repository.name, (.content.number|tostring), .id, $status, ($abiertos|tostring), ($mergeados|tostring)]
            | @tsv' /tmp/items.json > /tmp/items.tsv

          wc -l < /tmp/items.tsv | xargs echo "items de este repo en el tablero:"

      - name: Mover las issues en el tablero
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          NUMEROS: ${{ steps.calc.outputs.numeros }}
          DESTINO: ${{ steps.calc.outputs.destino }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          mover() {
            local item_id="$1" destino="$2" num="$3" actual="$4"
            if [ "$actual" = "$destino" ]; then return 0; fi
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field, value: {singleSelectOptionId: $option}
                }) { projectV2Item { id } }
              }' \
              -f project="$PROJECT_ID" -f item="$item_id" -f field="$FIELD_ID" -f option="$destino" >/dev/null
            echo "  #$num: ${actual:-vacio} -> $destino"
          }

          # --- Modo manual: sincronizar todas las issues de este repo ---
          if [ "$EVENT" = "workflow_dispatch" ] && [ -z "$NUMEROS" ]; then
            echo "Sincronizando todas las issues de $REPO..."
            # Los PRs abiertos se traen UNA vez (no por issue): el bucle hacia
            # una llamada a la API por cada issue.
            # Se excluyen los PRs de release-please: su changelog menciona
            # los issues de la release anterior ("closes [#43]"), y eso ponia
            # issues en "In Review" sin que hubiera trabajo en ellas.
            PRS="$(gh api "repos/$REPO/pulls?state=open&per_page=100" | jq -r '.[] | select(.head.ref | startswith("release-please--") | not) | "###" + (.number|tostring) + "\n" + (.body // "") + "\n" + (.head.ref // "")')"
            while IFS=$'\t' read -r repo num item_id status abiertos mergeados; do
              [ -z "$num" ] && continue
              estado="$(gh api "repos/$REPO/issues/$num" --jq '.state' 2>/dev/null || echo "")"
              [ -z "$estado" ] && continue
              # PRs MERGED: los tiene el tablero (GitHub los mantiene al dia).
              # PRs ABIERTOS: se buscan por API, porque el campo del tablero
              # "linked pull requests" no siempre esta al dia.
              abiertos="$(printf '%s' "$PRS" | grep -cE "(^|[^0-9])#$num([^0-9]|$)|issue-$num([^0-9]|$)" || true)"

              if [ "$estado" = "closed" ] || [ "$mergeados" -gt 0 ]; then destino="$OPT_DONE"
              elif [ "$abiertos" -gt 0 ]; then destino="$OPT_IN_REVIEW"
              elif [ "$status" = "$OPT_IN_REVIEW" ]; then destino="$OPT_TODO"
              else continue
              fi
              mover "$item_id" "$destino" "$num" "$status"
            done < /tmp/items.tsv
            exit 0
          fi

          # --- Modo evento ---
          if [ -z "$DESTINO" ] || [ -z "$NUMEROS" ]; then
            echo "Nada que sincronizar."
            exit 0
          fi

          for num in $NUMEROS; do
            [ -z "$num" ] && continue

            # En estos repos los PRs y las issues comparten numeracion: hay que
            # confirmar que el numero es de una ISSUE y no de un PR.
            if ! gh api "repos/$REPO/issues/$num" --jq '.pull_request' 2>/dev/null | grep -q null; then
              echo "  #$num no es una issue: se omite."
              continue
            fi

            fila="$(awk -F'\t' -v n="$num" '$2==n {print; exit}' /tmp/items.tsv)"

            if [ -z "$fila" ]; then
              echo "  #$num no esta en el tablero: se agrega."
              gh api graphql -f query='
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } }
                }' \
                -f project="$PROJECT_ID" \
                -f content="$(gh api "repos/$REPO/issues/$num" --jq .node_id)" >/dev/null 2>&1 || true
              sleep 3
              fila="$(awk -F'\t' -v n="$num" '$2==n {print; exit}' /tmp/items.tsv)"
              if [ -z "$fila" ]; then echo "  #$num: no se pudo agregar."; continue; fi
            fi

            item_id="$(printf '%s' "$fila" | cut -f3)"
            actual="$(printf '%s' "$fila" | cut -f4)"
            mover "$item_id" "$DESTINO" "$num" "$actual"
          done
