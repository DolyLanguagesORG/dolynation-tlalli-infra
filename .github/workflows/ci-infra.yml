name: infra

on:
  # Sin filtro de `paths`: los checks exigidos por la protección de ramas
  # deben reportar siempre.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validate:
    name: compose-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.prod.yml referencia ./backend (un clone del repo de
      # backend). Se clona para que `docker compose config` pueda resolver
      # el contexto de build.
      - name: Clonar el backend
        run: git clone --depth 1 https://github.com/DolyLanguagesORG/dolynation-atl-back.git backend

      - name: Validar docker-compose.test.yml
        run: docker compose -f docker-compose.test.yml config

      - name: Validar docker-compose.dev.yml
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dolynglish
        run: docker compose -f docker-compose.dev.yml config

      - name: Validar docker-compose.prod.yml
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dolynglish
        run: docker compose -f docker-compose.prod.yml config

      - name: Test del regex de pr-labels
        run: node .github/workflows/pr-labels.regex.test.cjs

  schema-sql:
    name: schema-sql
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dolynglish
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # El schema es la fuente de verdad de la base de datos: este job
      # comprueba que 01-init.sql y los updates/ pendientes son sintacticamente
      # validos y se aplican en orden sobre una base limpia. Los updates/ que
      # aun no existan se omiten sin fallar.
      - name: Aplicar 01-init.sql
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dolynglish \
            -f database/postgres/01-init.sql

      - name: Aplicar updates/ en orden
        env:
          PGPASSWORD: postgres
        run: |
          shopt -s nullglob
          files=(database/postgres/updates/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No hay updates/ todavia: se omite."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dolynglish -f "$f"
            echo "::endgroup::"
          done
