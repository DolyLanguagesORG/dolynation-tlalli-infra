name: smoke-live

# Smoke contra el ambiente REAL de desarrollo.
#
# POR QUE EXISTE
#
# Los e2e de los repositorios corren contra un API **mock**: comprueban el
# contrato de la interfaz, pero no que el backend real, el proveedor de IA y
# la base de datos se hablen bien entre si. Ese es el hueco por el que se
# colaron los 500 del schema y el 404 del badge de version: los dos eran
# invisibles para la CI.
#
# Este workflow cubre ese hueco **con el coste acotado**: genera UNA sola
# lectura (1-3 llamadas al provider). Por eso corre **por la noche** y no en
# cada push: consume cuota del tier gratis (20 lecturas/dia) y depende de que
# el provider este disponible.
#
# Si falla, el motivo viene en el mensaje: cuota agotada (429) o provider caido.
# Para el detalle del error del provider: `GET /api/v1/admin/prompt-logs`
# (solo administradores).

on:
  schedule:
    # 03:17 UTC: fuera de hora punta de uso y de la ventana de cuota.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      api:
        description: 'URL base de la API de desarrollo'
        required: false
        default: 'https://devapi.yacaterkos.tech/api/v1'
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-live
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke contra desarrollo
    runs-on: ubuntu-latest
    # Si el provider no esta disponible (cuota, caida), el smoke falla: es
    # informacion, no un bloqueo del release train.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Smoke live (una lectura contra el ambiente real)
        run: bash scripts/smoke-live.sh "${{ inputs.api || 'https://devapi.yacaterkos.tech/api/v1' }}"

      - name: Resumen
        if: always()
        run: |
          echo "### Smoke contra desarrollo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "El smoke genera **una** lectura contra el ambiente real de desarrollo." >> "$GITHUB_STEP_SUMMARY"
          echo "Si falla por \`AI_RATE_LIMITED\`, es la cuota del tier gratis, no el despliegue." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Detalle del error del provider: \`GET /api/v1/admin/prompt-logs\` (solo administradores)." >> "$GITHUB_STEP_SUMMARY"
