name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot genera sus propios titulos (`chore(deps): bump ...`),
          # que ya cumplen el formato. Ademas sus ramas no las elige una
          # persona, asi que la validacion de rama no aplica.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "PR de Dependabot: se omite la validacion del titulo."
            exit 0
          fi

          # Este repo no tiene un paquete de Conventional Commits instalado
          # en el workflow, así que validamos con una regex equivalente a
          # @commitlint/config-conventional sobre el tipo y el scope.
          # Ver conventions/commits.md

          types='feat|fix|refactor|docs|test|chore|build|ci|perf|style'

          regex="^(${types})(\([a-z0-9._/-]+\))?(!)?: .+"

          if [[ ! "$PR_TITLE" =~ $regex ]]; then
            echo "::error::Título de PR inválido: '$PR_TITLE'"
            echo ""
            echo "::error::Debe seguir Conventional Commits, por ejemplo:"
            echo "::error::  feat(auth): agregar registro de usuarios"
            echo "::error::  fix(readings): corregir prompt de dificultad alta"
            echo "::error::  chore(deps): actualizar nestjs a 11.1"
            echo ""
            echo "::error::Formato: <tipo>(<scope>): <descripción>"
            echo "::error::Tipos permitidos: $types"
            echo "::error::Un breaking change lleva '!' antes de los dos puntos."
            exit 1
          fi

          echo "Título válido: '$PR_TITLE'"

  pr-target:
    name: pr-target
    runs-on: ubuntu-latest
    steps:
      - name: Validar rama base y rama origen
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot crea sus ramas con su propio nombre
          # (`dependabot/npm_and_yarn/...`), que no sigue la convencion del
          # equipo y no se puede renombrar desde el bot. Se exime de la
          # validacion de la rama origen; la base y los demas checks siguen
          # aplicandose.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "PR de Dependabot: se omite la validacion de la rama origen."
            exit 0
          fi

          # release-please crea la rama del PR de release con su propio
          # nombre (`release-please--branches--develop--components--<pkg>`),
          # que no sigue la convencion del equipo. Ese PR lo genera la
          # maquinaria de versionado, no una persona, asi que la validacion de
          # la rama origen no aplica. La base y los demas checks siguen
          # aplicandose.
          #
          # Se exime por el NOMBRE de la rama, no por el autor: el PR lo abre
          # la cuenta que tiene el PAT del bot, no la cuenta `release-please`.
          case "$HEAD" in
            release-please--*)
              echo "PR de release-please: se omite la validacion de la rama origen."
              exit 0
              ;;
          esac

          # Hace cumplir lo que describe conventions/git-workflow.md.
          # La protección de GitHub no puede restringir la rama origen de un
          # PR, así que se valida aquí.
          # Ver conventions/git-workflow.md

          case "$BASE" in
            develop)
              # Convención de ramas: <tipo>/issue-<n>-<módulo>-<detalle>
              #   p. ej. feat/issue-12-users-profile
              #   (el prefijo 'issue-' es opcional: feat/12-users-profile también vale)
              # También se acepta el formato que genera el botón "Create a branch"
              # del issue (<n>-<slug>), para no bloquear su uso.
              # Ver conventions/git-workflow.md
              types='feat|fix|refactor|docs|test|chore|build|ci|perf|style'

              # La rama se normaliza antes de validar (sin acentos y en
              # minusculas). El boton "Create a branch" de GitHub arma el
              # nombre a partir del titulo del issue y puede dejar acentos
              # ("3-maquetado-e-integracion-..."): con la validacion tal cual
              # ese PR no se podia mergear nunca.
              HEAD_NORM="$(printf '%s' "$HEAD" | iconv -f UTF-8 -t ASCII//TRANSLIT 2>/dev/null | tr '[:upper:]' '[:lower:]' || printf '%s' "$HEAD")"

              if [ "$HEAD" != "$HEAD_NORM" ]; then
                echo "::warning::La rama '$HEAD' tiene acentos o mayusculas. Se valida como '$HEAD_NORM'."
                echo "::warning::La forma canonica es sin acentos (p. ej. 'integracion'), pero no bloquea el PR."
              fi

              if [[ "$HEAD_NORM" =~ ^(${types})/(issue-)?[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
                :
              elif [[ "$HEAD_NORM" =~ ^[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
                :
              else
                echo "::error::Rama origen inválida para 'develop': '$HEAD'"
                echo "::error::Usa <tipo>/issue-<n>-<módulo>-<detalle>, por ejemplo:"
                echo "::error::  feat/issue-12-users-profile"
                echo "::error::  fix/issue-30-history-pagination"
                echo "::error::Tipos permitidos: $types"
                echo "::error::También se acepta el formato del botón del issue: <n>-<slug>."
                exit 1
              fi
              ;;
            main)
              # A produccion entra develop (releases), hotfix/* y las ramas
              # rc-<version> (la combinacion de versiones que ya paso por
              # rehearsal y staging).
              if [[ "$HEAD" != "develop" && ! "$HEAD" =~ ^hotfix/ && ! "$HEAD" =~ ^rc- ]]; then
                echo "::error::Un PR hacia 'main' solo puede venir de 'develop' o de 'hotfix/*'."
                echo "::error::Rama origen actual: '$HEAD'"
                echo "::error::'main' es la rama de produccion; ver conventions/git-workflow.md"
                exit 1
              fi
              ;;
            *)
              echo "::error::Base '$BASE' no permitida. Solo 'develop' y 'main' aceptan PRs."
              exit 1
              ;;
          esac

          echo "Rama origen '$HEAD' → base '$BASE': permitido."
