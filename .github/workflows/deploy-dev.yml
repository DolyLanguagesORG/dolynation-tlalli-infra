name: deploy-dev

# Deploy del stack de desarrollo (Postgres + backend + frontend) al servidor.
# Se dispara cuando cambia algo que afecta a DEV. `versions.yaml` (staging/prod)
# queda fuera de forma intencional: NO es parte de este workflow.

on:
  push:
    branches: [develop]
    paths:
      - 'docker-compose.dev.yml'
      - 'scripts/**'
      - 'database/**'
      - '.env.dev.example'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  # GitHub actualiza el estado del deployment automaticamente; sin este
  # permiso el GITHUB_TOKEN es de solo lectura y no puede reportarlo.
  deployments: write

concurrency:
  group: deploy-dev-infra
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar stack de desarrollo
    runs-on: ubuntu-latest
    environment: desarrollo
    # Un push hecho por el propio bot no debe re-disparar el deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pusher.name != 'github-actions[bot]'
    steps:
      - name: Instalar llave SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi

          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_PORT:-}" ]; then
            echo "::error::Faltan secrets de despliegue (DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PORT) en el environment 'desarrollo'."
            exit 1
          fi

          mkdir -p ~/.ssh
          # La llave es PEM y puede traer CRLF: se normaliza a LF.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # La llave tiene passphrase y el runner no es interactivo, asi que
          # ssh-add necesita un askpass que se la entregue.
          #
          # El agente y el askpass se dejan en ~/.ssh porque **cada paso del
          # workflow corre en un shell nuevo**: lo que se exporta aqui no llega
          # al paso siguiente. Los pasos que usan `ssh` vuelven a cargarlos con
          # `. ~/.ssh/agent_env`.
          if [ -n "${DEPLOY_SSH_KEY_PASSPHRASE:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY_PASSPHRASE" > ~/.ssh/deploy_passphrase
            chmod 600 ~/.ssh/deploy_passphrase
            printf '%s\n' '#!/usr/bin/env bash' 'cat ~/.ssh/deploy_passphrase' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            # ssh-agent -s imprime tambien un "echo Agent pid ..." que no es un
            # comando valido como script: se filtran solo los export.
            ssh-agent -s | grep '^SSH_AUTH_SOCK\|^SSH_AGENT_PID' > ~/.ssh/agent_env
            . ~/.ssh/agent_env
            if ! ssh-add ~/.ssh/deploy_key; then
              echo "::error::No se pudo cargar la llave en el agente SSH. Revisa DEPLOY_SSH_KEY_PASSPHRASE."
              exit 1
            fi
            echo "Llave cargada en el agente SSH."
          fi

          # La clave del host se fija por fingerprint: no se acepta la primera
          # conexion a ciegas. Si el host cambia, hay que actualizar el secret.
          # La clave del host ya no se acepta "a ciegas": se compara con la
          # que esta en el secret DEPLOY_HOST_KEY. Si no coincide (el host
          # cambio o hay un intermediario), el deploy se detiene.
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /tmp/host_keys 2>&1 || true
          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            if ! grep -qF "$DEPLOY_HOST_KEY" /tmp/host_keys; then
              echo "::error::La clave del host no coincide con DEPLOY_HOST_KEY."
              echo "::error::Si el host cambio de verdad, actualiza el secret antes de desplegar."
              exit 1
            fi
          fi
          if [ ! -s /tmp/host_keys ]; then
            echo "::error::No se pudo obtener la clave del host $DEPLOY_HOST:$DEPLOY_PORT."
            echo "::error::Detalle del escaneo:"
            cat /tmp/host_keys
            exit 1
          fi
          cat /tmp/host_keys >> ~/.ssh/known_hosts

      - name: Escribir los .env en el servidor
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          HOST: ${{ vars.HOST }}
          API_PREFIX: ${{ vars.API_PREFIX }}
          APP_NAME: ${{ vars.APP_NAME }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_LOGGING: ${{ vars.DB_LOGGING }}
          JWT_ACCESS_TTL: ${{ vars.JWT_ACCESS_TTL }}
          JWT_REFRESH_TTL: ${{ vars.JWT_REFRESH_TTL }}
          AI_DEFAULT_PROVIDER: ${{ vars.AI_DEFAULT_PROVIDER }}
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL }}
          MINIMAX_REASONING_EFFORT: ${{ vars.MINIMAX_REASONING_EFFORT }}
          GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL }}
          OPENAI_MODERATION_ENDPOINT: ${{ vars.OPENAI_MODERATION_ENDPOINT }}
          OPENAI_MODERATION_MODEL: ${{ vars.OPENAI_MODERATION_MODEL }}
          CATEGORY_MODERATION_ENABLED: ${{ vars.CATEGORY_MODERATION_ENABLED }}
          CATEGORY_MODERATION_AI_ENABLED: ${{ vars.CATEGORY_MODERATION_AI_ENABLED }}
          CATEGORY_MODERATION_AI_PROVIDER: ${{ vars.CATEGORY_MODERATION_AI_PROVIDER }}
          CATEGORY_DAILY_LIMIT: ${{ vars.CATEGORY_DAILY_LIMIT }}
          CATEGORY_MODERATION_SCORE_THRESHOLD: ${{ vars.CATEGORY_MODERATION_SCORE_THRESHOLD }}
          CATEGORY_MODERATION_TIMEOUT_MS: ${{ vars.CATEGORY_MODERATION_TIMEOUT_MS }}
          CATEGORY_MODERATION_CACHE_TTL_MS: ${{ vars.CATEGORY_MODERATION_CACHE_TTL_MS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
          EMAIL_VERIFICATION_REQUIRED: ${{ vars.EMAIL_VERIFICATION_REQUIRED }}
          BILLING_PROVIDER: ${{ vars.BILLING_PROVIDER }}
          BILLING_ENV_TAG: ${{ vars.BILLING_ENV_TAG }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_CURRENCY: ${{ vars.STRIPE_CURRENCY }}
          STRIPE_CHECKOUT_UI_MODE: ${{ vars.STRIPE_CHECKOUT_UI_MODE }}
          STRIPE_PRICE_DOLLY: ${{ vars.STRIPE_PRICE_DOLLY }}
          STRIPE_PRICE_DOLLY_PLUS: ${{ vars.STRIPE_PRICE_DOLLY_PLUS }}
          STRIPE_PRICE_DOLLY_PRO: ${{ vars.STRIPE_PRICE_DOLLY_PRO }}
          STRIPE_PRICE_LANGUAGE_UNLOCK: ${{ vars.STRIPE_PRICE_LANGUAGE_UNLOCK }}
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_DATABASE: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi

          # 1. El .env de la INFRAESTRUCTURA: lo usa `docker compose` para
          #    crear la base (POSTGRES_*).
          INFRA_CONTENT="$(printf 'POSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\n' \
            "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" | base64 -w0)"
          echo "$INFRA_CONTENT" | ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "umask 077 && base64 -d > '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra/.env'"

          # 2. El .env del BACKEND: es el que lee la aplicacion (ConfigModule
          #    lo busca en su directorio de trabajo, que en el contenedor es
          #    /app, montado desde el repo del backend). Antes este archivo
          #    se escribia a mano en el servidor y el pipeline no lo
          #    tocaba: ningun secreto se podia rotar por el deploy.
          BACKEND_CONTENT="$(printf 'NODE_ENV=%s\nPORT=%s\nHOST=%s\nAPI_PREFIX=%s\nAPP_NAME=%s\nLOG_LEVEL=%s\nDB_HOST=%s\nDB_PORT=%s\nDB_LOGGING=%s\nJWT_ACCESS_TTL=%s\nJWT_REFRESH_TTL=%s\nAI_DEFAULT_PROVIDER=%s\nMINIMAX_MODEL=%s\nMINIMAX_REASONING_EFFORT=%s\nGOOGLE_MODEL=%s\nOPENAI_MODERATION_ENDPOINT=%s\nOPENAI_MODERATION_MODEL=%s\nCATEGORY_MODERATION_ENABLED=%s\nCATEGORY_MODERATION_AI_ENABLED=%s\nCATEGORY_MODERATION_AI_PROVIDER=%s\nCATEGORY_DAILY_LIMIT=%s\nCATEGORY_MODERATION_SCORE_THRESHOLD=%s\nCATEGORY_MODERATION_TIMEOUT_MS=%s\nCATEGORY_MODERATION_CACHE_TTL_MS=%s\nSMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_FROM=%s\nSMTP_FROM_NAME=%s\nSMTP_SECURE=%s\nFRONTEND_BASE_URL=%s\nEMAIL_VERIFICATION_REQUIRED=%s\nBILLING_PROVIDER=%s\nBILLING_ENV_TAG=%s\nSTRIPE_PUBLISHABLE_KEY=%s\nSTRIPE_CURRENCY=%s\nSTRIPE_CHECKOUT_UI_MODE=%s\nSTRIPE_PRICE_DOLLY=%s\nSTRIPE_PRICE_DOLLY_PLUS=%s\nSTRIPE_PRICE_DOLLY_PRO=%s\nSTRIPE_PRICE_LANGUAGE_UNLOCK=%s\nDB_USER=%s\nDB_PASSWORD=%s\nDB_DATABASE=%s\nJWT_SECRET=%s\nMINIMAX_API_KEY=%s\nGOOGLE_API_KEY=%s\nOPENAI_API_KEY=%s\nSMTP_USER=%s\nSMTP_PASSWORD=%s\nSTRIPE_SECRET_KEY=%s\nSTRIPE_WEBHOOK_SECRET=%s\n' \
            "$NODE_ENV" \
            "$PORT" \
            "$HOST" \
            "$API_PREFIX" \
            "$APP_NAME" \
            "$LOG_LEVEL" \
            "$DB_HOST" \
            "$DB_PORT" \
            "$DB_LOGGING" \
            "$JWT_ACCESS_TTL" \
            "$JWT_REFRESH_TTL" \
            "$AI_DEFAULT_PROVIDER" \
            "$MINIMAX_MODEL" \
            "$MINIMAX_REASONING_EFFORT" \
            "$GOOGLE_MODEL" \
            "$OPENAI_MODERATION_ENDPOINT" \
            "$OPENAI_MODERATION_MODEL" \
            "$CATEGORY_MODERATION_ENABLED" \
            "$CATEGORY_MODERATION_AI_ENABLED" \
            "$CATEGORY_MODERATION_AI_PROVIDER" \
            "$CATEGORY_DAILY_LIMIT" \
            "$CATEGORY_MODERATION_SCORE_THRESHOLD" \
            "$CATEGORY_MODERATION_TIMEOUT_MS" \
            "$CATEGORY_MODERATION_CACHE_TTL_MS" \
            "$SMTP_HOST" \
            "$SMTP_PORT" \
            "$SMTP_FROM" \
            "$SMTP_FROM_NAME" \
            "$SMTP_SECURE" \
            "$FRONTEND_BASE_URL" \
            "$EMAIL_VERIFICATION_REQUIRED" \
            "$BILLING_PROVIDER" \
            "$BILLING_ENV_TAG" \
            "$STRIPE_PUBLISHABLE_KEY" \
            "$STRIPE_CURRENCY" \
            "$STRIPE_CHECKOUT_UI_MODE" \
            "$STRIPE_PRICE_DOLLY" \
            "$STRIPE_PRICE_DOLLY_PLUS" \
            "$STRIPE_PRICE_DOLLY_PRO" \
            "$STRIPE_PRICE_LANGUAGE_UNLOCK" \
            "$DB_USER" \
            "$DB_PASSWORD" \
            "$DB_DATABASE" \
            "$JWT_SECRET" \
            "$MINIMAX_API_KEY" \
            "$GOOGLE_API_KEY" \
            "$OPENAI_API_KEY" \
            "$SMTP_USER" \
            "$SMTP_PASSWORD" \
            "$STRIPE_SECRET_KEY" \
            "$STRIPE_WEBHOOK_SECRET" | base64 -w0)"
          echo "$BACKEND_CONTENT" | ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "umask 077 && base64 -d > '${{ secrets.ORG_PATH }}/dolynation-atl-back/.env'"

      # El orden importa: primero se aplica el schema (que puede recrear la
      # base) y despues se levanta el stack. Al revés, el backend arrancaria
      # contra el schema viejo y fallaria con HTTP 500 en cuanto tocara una
      # tabla nueva.
      #
      # `FORCE=1`: en desarrollo los datos son desechables, asi que si el
      # schema cambio la base se recrea sin preguntar. En staging y produccion
      # NO se usa: si la base tiene datos, el script se niega a borrarla.
      - name: Actualizar infra y levantar el stack
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e; cd '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra'; git fetch --prune origin; git reset --hard origin/develop; git clean -fdq; FORCE=1 bash scripts/apply-schema.sh; docker compose -f docker-compose.dev.yml up -d"

