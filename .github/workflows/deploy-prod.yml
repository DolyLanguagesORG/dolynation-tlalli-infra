name: deploy-prod

# Despliega el ambiente de PRODUCCION.
#
# El environment `produccion` tiene required reviewers: GitHub PAUSA el
# workflow antes de tocar el servidor y espera a que alguien lo apruebe. Es
# el gate nativo de "esta publicacion sale ahora".
#
# El deploy nunca compila en el servidor: baja la imagen por SHA desde
# GHCR. El SHA anterior queda registrado para poder hacer rollback.
#
# Ver operations/PLAN-DE-DESPLIEGUE.md.

on:
  # Produccion NO se despliega al empujar una rc: eso publicaria sin que
  # nadie lo decidiera. Solo se despliega cuando alguien lo pide a mano
  # (workflow_dispatch) y aprueba el environment `prod`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a desplegar (vacio = el del manifiesto)'
        required: false
        type: string

permissions:
  contents: read
  # Reporta el estado del deployment a GitHub.
  deployments: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar el ambiente de produccion
    runs-on: ubuntu-latest
    # `prod` es el environment con los dos revisores (AzaelG26 y
    # EliasGalarza333) y sin self-review. GitHub PAUSA el workflow aqui.
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Instalar llave SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${DEPLOY_SSH_KEY_PASSPHRASE:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY_PASSPHRASE" > ~/.ssh/deploy_passphrase
            chmod 600 ~/.ssh/deploy_passphrase
            printf '%s\n' '#!/usr/bin/env bash' 'cat ~/.ssh/deploy_passphrase' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            ssh-agent -s | grep '^SSH_AUTH_SOCK\|^SSH_AGENT_PID' > ~/.ssh/agent_env
            . ~/.ssh/agent_env
            ssh-add ~/.ssh/deploy_key
          fi

          # La clave del host ya no se acepta "a ciegas": se compara con la
          # que esta en el secret DEPLOY_HOST_KEY. Si no coincide (el host
          # cambio o hay un intermediario), el deploy se detiene.
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /tmp/host_keys 2>&1 || true
          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            if ! grep -qF "$DEPLOY_HOST_KEY" /tmp/host_keys; then
              echo "::error::La clave del host no coincide con DEPLOY_HOST_KEY."
              echo "::error::Si el host cambio de verdad, actualiza el secret antes de desplegar."
              exit 1
            fi
          fi
          if [ ! -s /tmp/host_keys ]; then
            echo "::error::No se pudo obtener la clave del host."
            exit 1
          fi
          cat /tmp/host_keys >> ~/.ssh/known_hosts

      - name: Subir los archivos del ambiente
        # El servidor usa EXACTAMENTE los archivos del commit que se
        # despliega (compose, scripts, manifiesto y schema). Asi no puede
        # pasar que el servidor tenga una version vieja del compose o del
        # manifiesto mientras el repo ya va en otro lado.
        run: |
          set -euo pipefail

          # El manifiesto de versiones se toma de `develop`, que es donde lo
          # mantiene `sync-versions`: la rc puede ser un commit anterior al
          # ultimo aviso de release, y con el manifiesto viejo se desplegarian
          # imagenes que ya no son.
          curl -fsSL \
            "https://raw.githubusercontent.com/DolyLanguagesORG/dolynation-tlalli-infra/develop/versions.yml" \
            -o versions.yml

          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi

          # El tarball viaja por stdin del propio ssh. Con `scp` el archivo
          # no llegaba al servidor (el comando salia con exito y el archivo no
          # estaba), y el `tar` remoto fallaba con "No such file or
          # directory".
          tar -czf - \
            docker-compose.env.yml \
            versions.yml \
            scripts \
            database \
            | ssh -i ~/.ssh/deploy_key \
                -p "${{ secrets.DEPLOY_PORT }}" \
                -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                "mkdir -p '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra' && \
                 tar -xzf - -C '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra' && \
                 chmod +x '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra'/scripts/*.sh"

      - name: Escribir el .env del entorno
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          # El dominio publico del frontend de produccion todavia no esta
          # definido (nginx aun no tiene su server_name). Se lee de la variable
          # de environment `FRONTEND_BASE_URL` del environment `prod`: hay que
          # crearla antes de que los correos de produccion funcionen.
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
          EMAIL_VERIFICATION_REQUIRED: "true"
        run: |
          set -euo pipefail

          # La llave del servidor tiene passphrase: el agente SSH es lo que
          # permite usarla sin prompt. Sin esto, `ssh` falla con
          # "Permission denied (publickey)".
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi

          # El .env lo escribe el workflow, no lo genera el servidor: asi
          # los secretos nunca pasan por un archivo en disco del servidor.
          CONTENT="$(printf 'POSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\nDB_USER=%s\nDB_PASSWORD=%s\nDB_DATABASE=%s\nJWT_SECRET=%s\nMINIMAX_API_KEY=%s\nMINIMAX_MODEL=%s\nSMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USER=%s\nSMTP_PASSWORD=%s\nSMTP_FROM=%s\nSMTP_FROM_NAME=%s\nSMTP_SECURE=%s\nFRONTEND_BASE_URL=%s\nEMAIL_VERIFICATION_REQUIRED=%s\n' \
            "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" \
            "$DB_USER" "$DB_PASSWORD" "$DB_DATABASE" "$JWT_SECRET" \
            "$MINIMAX_API_KEY" "$MINIMAX_MODEL" \
            "$SMTP_HOST" "$SMTP_PORT" "$SMTP_USER" "$SMTP_PASSWORD" \
            "$SMTP_FROM" "$SMTP_FROM_NAME" "$SMTP_SECURE" \
            "$FRONTEND_BASE_URL" "$EMAIL_VERIFICATION_REQUIRED" | base64 -w0)"

          echo "$CONTENT" | ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "umask 077 && base64 -d > '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra/.env'"

      - name: Desplegar
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi

          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "ORG_DIR='${{ secrets.ORG_PATH }}' \
             COMPOSE_PROJECT_NAME=doly-prod \
             DB_HOST_PORT=57030 BACKEND_HOST_PORT=57031 FRONTEND_HOST_PORT=57032 \
             IMAGE_TAG='$TAG' \
             bash '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra/scripts/deploy-env.sh'"

      - name: Verificar la version desplegada
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          VERSION="$(curl -fsSL https://raw.githubusercontent.com/DolyLanguagesORG/dolynation-tlalli-infra/develop/versions.yml \
            | grep -E '^app_version:' | head -1 | cut -d: -f2 | tr -d ' \"')"

          echo "Version del manifiesto: $VERSION"
          echo "La verificacion del endpoint /api/v1/version la hace el smoke test."
