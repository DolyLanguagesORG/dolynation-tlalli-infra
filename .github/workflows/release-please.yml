name: release-please

# Versionado automático en `develop`.
#
# release-please mantiene UN pull request de release acumulativo contra
# `develop`: lo actualiza con cada merge y, al mergearlo, publica el tag
# `vX.Y.Z` y la GitHub Release.
#
# Por qué en `develop` y no en `main`: el versionado tiene que *verse* subir
# mientras se trabaja. Si el tag solo naciera al llegar a `main`, en
# desarrollo el número del `package.json` se quedaría congelado durante
# semanas y no se podría saber qué versión está corriendo el servidor.
#
# El token es un PAT (`RELEASE_PLEASE_TOKEN`) y no el `GITHUB_TOKEN` del
# workflow: el `GITHUB_TOKEN` no dispara otros workflows, así que los checks
# requeridos (`unit-and-static`, `e2e`, `build`, `openapi-guard`, `pr-title`,
# `pr-target`) nunca correrían en el PR del bot y el merge se quedaría
# bloqueado.
#
# Ver conventions/versioning.md en el repo de documentación.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  # El bot abre y actualiza el PR de release, y etiqueta el tag al mergear.
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-${{ github.repository }}
  # No se cancela: si el bot ya está creando el release, dejarlo terminar
  # evita dos tags con la misma versión.
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json


      # release-please crea el tag *lightweight*: apunta al commit, pero sin
      # objeto de tag, así que no conserva la fecha ni el mensaje. La
      # convención del equipo es que los tags sean anotados. Este paso lo
      # convierte sin cambiar a qué commit apunta.
      - name: Preparar el repositorio
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Convertir el tag en anotado
        if: steps.release.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          if [ "$(git cat-file -t "$VERSION")" = "commit" ]; then
            sha="$(git rev-parse "$VERSION^{commit}")"
            git tag -d "$VERSION"
            git tag -a "$VERSION" -m "Release $VERSION" "$sha"
            git push --force origin "refs/tags/$VERSION"
            echo "El tag $VERSION ahora es anotado."
          else
            echo "El tag $VERSION ya era anotado: no se toca."
          fi

      # Avisa al manifiesto del proyecto (`dolynation-tlalli-infra`) de que este
      # repositorio publicó una versión, para que actualice su fila en
      # `versions.yml` y abra el PR correspondiente. Es lo que mantiene el
      # manifiesto al día sin que nadie lo edite a mano.
      - name: Notificar el manifiesto de versiones
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          VERSION: ${{ steps.release.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse "$VERSION^{commit}")"
          gh api "repos/DolyLanguagesORG/dolynation-tlalli-infra/dispatches" \
            -f event_type=release-published \
            -f "client_payload[repository]=$REPO" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[sha]=$sha"

      # release-please no tiene auto-merge propio: se activa aquí sobre el PR
      # que acaba de crear o actualizar. El PR queda en cola y se mergea solo
      # cuando los checks en verde.
      #
      # Si el auto-merge falla (por ejemplo porque el repositorio no lo tiene
      # habilitado) el paso no rompe el workflow: el PR sigue abierto y una
      # persona puede mergearlo a mano.
      - name: Activar auto-merge en el PR de release
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_URL: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail

          number="$(printf '%s' "$PR_URL" | sed -n 's#.*/pull/\([0-9]*\).*#\1#p')"
          if [ -z "$number" ]; then
            echo "::warning::No se pudo deducir el número del PR desde '$PR_URL'."
            exit 0
          fi

          echo "Activando auto-merge en el PR #$number"
          if ! gh pr merge "$number" --repo "${{ github.repository }}" --squash --auto; then
            echo "::warning::No se pudo activar el auto-merge en el PR #$number."
            echo "::warning::El PR sigue abierto: se puede mergear a mano."
          fi
