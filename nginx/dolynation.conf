# Proxy inverso de DolyNation.
#
# Los puertos de los upstreams son los del entorno correspondiente:
#   5702x -> staging (publico detras de Cloudflare)
#   5703x -> produccion (publico detras de Cloudflare)
#
# Desarrollo (5701x) NO se publica aqui: devapi/devplay/dev.dolynation.app
# viven exclusivamente dentro de la VPN WireGuard (10.90.0.2/3/5).
#
# Cloudflare se conecta a este servidor por HTTPS (puerto 443) con el
# certificado de origen. Los contenedores no se exponen: solo escuchan en
# 127.0.0.1 (ver docker-compose.env.yml y docker-compose.site.yml).
#
# Certificados: Origin Certificate de Cloudflare (clave en
# /etc/ssl/dolynation/). Ese certificado solo es valido entre Cloudflare y
# este servidor, que es exactamente lo que se necesita: el navegador negocia
# TLS con el borde de Cloudflare, no con el origen.

# Restaurar IP real del visitante detras de Cloudflare (necesario para que
# `limit_req_zone $binary_remote_addr` y el rate-limit por IP en backend vean
# la IP del cliente final en lugar del nodo edge de Cloudflare).
# Rangos publicados por Cloudflare (IPv4 e IPv6):
# https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Limite de peticiones por IP: el backend tiene su propio limite de
# lecturas pendientes, pero esto frena el abuso desde internet.
limit_req_zone $binary_remote_addr zone=doly_per_ip:10m rate=30r/s;

# --- Staging (5702x) -----------------------------------------------------
# La API de staging NO se publica completa: el navegador habla con el backend
# a traves del proxy BFF de Next.js. Solo se enruta directo el webhook de Stripe.
upstream doly_staging_backend {
    server 127.0.0.1:57021;
    keepalive 16;
}

upstream doly_staging_frontend {
    server 127.0.0.1:57022;
    keepalive 32;
}

upstream doly_staging_landing {
    server 127.0.0.1:57023;
    keepalive 16;
}

# --- Produccion (5703x) --------------------------------------------------
upstream doly_prod_backend {
    server 127.0.0.1:57031;
    keepalive 16;
}

upstream doly_prod_frontend {
    server 127.0.0.1:57032;
    keepalive 32;
}

upstream doly_prod_landing {
    server 127.0.0.1:57033;
    keepalive 16;
}

# --- Rechazar hosts desconocidos o antiguos ------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# --- Redireccion HTTP -> HTTPS -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dolynation.app www.dolynation.app play.dolynation.app staging.dolynation.app stagingplay.dolynation.app;

    return 301 https://$host$request_uri;
}

# --- Staging: Aplicacion (stagingplay.dolynation.app) --------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stagingplay.dolynation.app;

    ssl_certificate     /etc/ssl/dolynation/origin.pem;
    ssl_certificate_key /etc/ssl/dolynation/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    limit_req zone=doly_per_ip burst=60 nodelay;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;

    # Webhooks de Stripe: pasan directo al backend para preservar `Stripe-Signature`
    # y el cuerpo crudo exacto sin cruzar el BFF de Next.js. La autenticidad se
    # valida criptograficamente por firma HMAC (`rawBody: true` + `STRIPE_WEBHOOK_SECRET`),
    # no por lista estatica de IPs detras de Cloudflare.
    location = /api/v1/billing/webhook {
        proxy_pass http://doly_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://doly_staging_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# --- Staging: Landing (staging.dolynation.app) ---------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.dolynation.app;

    ssl_certificate     /etc/ssl/dolynation/origin.pem;
    ssl_certificate_key /etc/ssl/dolynation/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    limit_req zone=doly_per_ip burst=60 nodelay;

    # X-Content-Type-Options, X-Frame-Options y Referrer-Policy ya los envia
    # nginx/landing.conf dentro del contenedor.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://doly_staging_landing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}

# --- Produccion: Aplicacion (play.dolynation.app) ------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.dolynation.app;

    ssl_certificate     /etc/ssl/dolynation/origin.pem;
    ssl_certificate_key /etc/ssl/dolynation/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    limit_req zone=doly_per_ip burst=60 nodelay;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    location = /api/v1/billing/webhook {
        proxy_pass http://doly_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://doly_prod_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# --- Produccion: Landing www -> apex (301 canonico) ----------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dolynation.app;

    ssl_certificate     /etc/ssl/dolynation/origin.pem;
    ssl_certificate_key /etc/ssl/dolynation/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://dolynation.app$request_uri;
}

