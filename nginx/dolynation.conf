# Proxy inverso de DolyNation.
#
# Los puertos de los upstreams son los del entorno correspondiente: 5701x para
# desarrollo, 5702x para staging y 5703x para produccion.
#
# Cloudflare se conecta a este servidor por HTTPS (puerto 443) con el
# certificado de origen. Los contenedores no se exponen: solo escuchan en
# 127.0.0.1 (ver docker-compose.dev.yml).
#
# Certificados: Origin Certificate de Cloudflare (clave en
# /etc/ssl/dolynation/). Ese certificado solo es valido entre Cloudflare y
# este servidor, que es exactamente lo que se necesita: el navegador negocia
# TLS con el borde de Cloudflare, no con el origen.

# Limite de peticiones por IP: el backend tiene su propio limite de
# lecturas pendientes, pero esto frena el abuso desde internet.
limit_req_zone $binary_remote_addr zone=doly_per_ip:10m rate=30r/s;

upstream doly_backend {
    server 127.0.0.1:57011;
    keepalive 32;
}

upstream doly_frontend {
    server 127.0.0.1:57012;
    keepalive 32;
}

# --- Redireccion HTTP -> HTTPS -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name devweb.yacaterkos.tech devapi.yacaterkos.tech;

    # Cloudflare puede estar en modo Flexible (solo cifra el lado del
    # navegador). Con el certificado de origen, el tramo Cloudflare -> origen
    # va cifrado y el puerto 80 solo recibe la redireccion.
    return 301 https://$host$request_uri;
}

# --- Frontend ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devweb.yacaterkos.tech;

    ssl_certificate     /etc/ssl/dolynation/origin.pem;
    ssl_certificate_key /etc/ssl/dolynation/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    limit_req zone=doly_per_ip burst=60 nodelay;

    # Cabeceras de seguridad basicas.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El frontend necesita saber que la peticion original venia por HTTPS,
    # aunque Cloudflare->origen ya llegue cifrado.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;

    client_max_body_size 2m;

    location / {
        proxy_pass http://doly_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# --- API -----------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devapi.yacaterkos.tech;

    ssl_certificate     /etc/ssl/dolynation/origin.pem;
    ssl_certificate_key /etc/ssl/dolynation/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    limit_req zone=doly_per_ip burst=60 nodelay;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;

    client_max_body_size 2m;

    location / {
        proxy_pass http://doly_backend;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        # La generacion con IA puede tardar mas que el default de nginx.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
