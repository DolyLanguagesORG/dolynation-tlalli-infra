services:
  database-postgres-dolynglish:
    image: postgres:15
    container_name: database-postgres-dolynglish
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "57000:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d
    networks:
      - dolynglish-network
    restart: always

  backend-dolynglish:
    build:
      # El backend se clona dentro de ./backend (ver Makefile / README).
      context: ./backend
      dockerfile: Dockerfile
    container_name: dolynglish-backend
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PORT=${PORT}
      - HOST=${HOST}
      - LOG_LEVEL=${LOG_LEVEL}
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL}
      - AI_DEFAULT_PROVIDER=${AI_DEFAULT_PROVIDER}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      # Correo transaccional (SMTP). En produccion el proveedor es Brevo.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_SECURE=${SMTP_SECURE}
      # Base publica del frontend: se usa para los enlaces de los correos.
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      # Exige confirmar el correo antes de poder iniciar sesion.
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED}
    ports:
      - "57001:3333"
    networks:
      - dolynglish-network
    depends_on:
      - database-postgres-dolynglish

volumes:
  postgres-data:

networks:
  dolynglish-network:
    driver: bridge
