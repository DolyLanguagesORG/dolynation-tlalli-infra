services:
  database-postgres-dolynglish:
    image: postgres:15
    container_name: database-postgres-dolynglish
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "57000:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d
    networks:
      - dolynglish-network
    restart: always

  backend-dolynglish:
    build:
      # El backend se clona dentro de ./backend (ver Makefile / README).
      context: ./backend
      dockerfile: Dockerfile
    container_name: dolynglish-backend
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - FRIEND_STREAK_CRON_ENABLED=${FRIEND_STREAK_CRON_ENABLED:-true}
      - FRIEND_STREAK_CRON_EXPRESSION=${FRIEND_STREAK_CRON_EXPRESSION:-0 6 * * *}
      - PORT=${PORT}
      - HOST=${HOST}
      - LOG_LEVEL=${LOG_LEVEL}
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL}
      - AI_DEFAULT_PROVIDER=${AI_DEFAULT_PROVIDER}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_MODEL=${MINIMAX_MODEL}
      - MINIMAX_REASONING_EFFORT=${MINIMAX_REASONING_EFFORT}
      # Proveedor Google (Gemini + gemini-decision-1).
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      # Moderacion de categorias dinamicas.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODERATION_ENDPOINT=${OPENAI_MODERATION_ENDPOINT}
      - OPENAI_MODERATION_MODEL=${OPENAI_MODERATION_MODEL}
      - CATEGORY_MODERATION_ENABLED=${CATEGORY_MODERATION_ENABLED}
      - CATEGORY_MODERATION_AI_ENABLED=${CATEGORY_MODERATION_AI_ENABLED}
      - CATEGORY_MODERATION_AI_PROVIDER=${CATEGORY_MODERATION_AI_PROVIDER}
      - CATEGORY_DAILY_LIMIT=${CATEGORY_DAILY_LIMIT}
      - CATEGORY_MODERATION_SCORE_THRESHOLD=${CATEGORY_MODERATION_SCORE_THRESHOLD}
      - CATEGORY_MODERATION_TIMEOUT_MS=${CATEGORY_MODERATION_TIMEOUT_MS}
      - CATEGORY_MODERATION_CACHE_TTL_MS=${CATEGORY_MODERATION_CACHE_TTL_MS}
      # Correo transaccional (SMTP). En produccion el proveedor es Brevo.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_SECURE=${SMTP_SECURE}
      # Base publica del frontend: se usa para los enlaces de los correos.
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      # Exige confirmar el correo antes de poder iniciar sesion.
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED}
      # Habilita solicitudes con aprobacion de administrador para planes y desbloqueo de idioma.
      - ACCESS_REQUESTS_ENABLED=${ACCESS_REQUESTS_ENABLED:-true}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL:-}
      # Seguridad anti-bot (Cloudflare Turnstile) y CORS.
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-disabled}
      - CAPTCHA_SITE_KEY=${CAPTCHA_SITE_KEY:-}
      - CAPTCHA_SECRET_KEY=${CAPTCHA_SECRET_KEY:-}
      - CAPTCHA_APPEARANCE=${CAPTCHA_APPEARANCE:-interaction-only}
      - CAPTCHA_ALLOWED_HOSTNAMES=${CAPTCHA_ALLOWED_HOSTNAMES:-}
      - CAPTCHA_TIMEOUT_MS=${CAPTCHA_TIMEOUT_MS:-5000}
      - CAPTCHA_FAIL_OPEN=${CAPTCHA_FAIL_OPEN:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "57001:3333"
    networks:
      - dolynglish-network
    depends_on:
      - database-postgres-dolynglish

volumes:
  postgres-data:

networks:
  dolynglish-network:
    driver: bridge
